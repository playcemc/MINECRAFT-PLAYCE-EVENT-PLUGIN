"balance":
  "proximity-range": 16
  "magnet-range": 40
  "strength-growth-start": 2.0
  "strength-growth-per-second": 0.025
  "strength-growth-max": 10.0
  "excited-health": 120
  "solo-offer-chance": 0.05
"abilities":
  "뒤늦은각성":
    "enabled": true
    "cost": 0
    "description": "(패시브) 피해를 받으면 아주 짧게 무적이 되고 피해를 받은 후 내 체력이 하트 5개보다 적다면 1초간 신속V를 얻습니다."
  "전력질주":
    "enabled": true
    "cost": 1
    "description": "(액티브) 4초간 신속 III."
    "duration-seconds": 4
  "몸부림":
    "enabled": true
    "cost": 3
    "description": "(대상 액티브) 경찰을 포함한 다른 플레이어를 좌클릭하면 자신의 체력을 전부 회복하고 5초간 신속 III를 얻습니다."
  "전생의지혜":
    "enabled": true
    "cost": 0
    "description": "(패시브) 감옥에서 격리 해제될 때 기본 무적에 더해 10초간 신속 V."
  "스프린트":
    "enabled": true
    "cost": 0
    "description": "(패시브) 2초간 웅크리고 있으면 2.5초 동안 매우 빠르게 이동합니다."
  "빌려온시간":
    "enabled": true
    "cost": 0
    "description": "(액티브) 2초간 신속 V 수준으로 질주한 뒤, 2초간 움직일 수 없게 됩니다. (움직일 수 없는 상태가 종료된 후부터 쿨타임 5초)"
  "밀치기":
    "enabled": true
    "cost": 3
    "description": "(대상 액티브) 경찰을 좌클릭하면 강하게 밀쳐냅니다."
  "토끼뜀":
    "enabled": true
    "cost": 2
    "description": "(액티브) 5초간 점프 강화 V."
  "본인해제":
    "enabled": true
    "cost": 20
    "description": "(액티브) 자신이 감옥에 갇혀 있을 경우 즉시 격리 해제됩니다."
  "흰우유":
    "enabled": true
    "cost": 0
    "description": "(액티브+패시브) 신속을 제외한 포션 효과, 발광, 핏자국, 구속, 실명 등의 상태를 제거합니다. 구속 또는 실명 상태에서 사용하면 5초간 신속II도 얻습니다."
  "자가치료":
    "enabled": true
    "cost": 3
    "description": "(액티브) 2초간 무적의 시간을 가진 뒤 1초간 투명화 됩니다. 그 후 자신의 체력을 완전히 회복합니다."
  "투명화":
    "enabled": true
    "cost": 2
    "description": "(액티브) 5초간 투명화됩니다. 설정 설명에는 주변에 거품 효과가 난다고 되어 있습니다."
    "duration-seconds": 5
  "완전투명화":
    "enabled": true
    "cost": 3
    "description": "(액티브) 3초간 완전 투명화. 단순 포션 투명화가 아니라 다른 플레이어에게 아예 숨겨집니다."
    "duration-seconds": 3
  "살금살금":
    "enabled": true
    "cost": 0
    "description": "(패시브) 웅크린 상태의 이동속도가 약 18배 증가합니다. 달리는 속도보다 빠를 수도 있습니다."
  "오래달리기":
    "enabled": true
    "cost": 1
    "description": "(액티브) 배고픔을 전부 회복합니다. 배고픔이 이미 꽉 차있다면 대신 하트 1개만큼 회복합니다."
  "어둠의자식":
    "enabled": true
    "cost": 0
    "description": "(패시브) 발광 상태가 되지 않습니다. 코드상 발광 부여 자체를 거부합니다. 웅크린 상태의 이동속도도 증가합니다. (기본 0.3 → 3.0).\n밤이 되는 순간 120초간 신속II를 얻습니다."
  "흥분":
    "enabled": true
    "cost": 0
    "description": "(패시브) 최대체력 50하트를 추가로 얻습니다. 게임 시작과 격리 해제 시 최대 체력까지 회복합니다."
  "불굴":
    "enabled": true
    "cost": 0
    "description": "(패시브) 누적 2회 격리 후 활동 상태에서는 상시 신속 III, 최대 체력이 5하트가 됩니다. 흥분보다 우선합니다."
  "다섯의심장":
    "enabled": true
    "cost": 0
    "description": "(패시브) 일반 도둑은 3번째 격리에서 탈락하지만 이 능력 보유자는 5번째 격리에서 탈락합니다."
  "탈출집념":
    "enabled": true
    "cost": 40
    "description": "(액티브) 최종 탈출구가 닫혀 있을 경우 감옥 바로 앞으로 즉시 순간이동합니다. 최종 탈출구가 열려 있을 경우 탈출구 앞으로 즉시 순간이동합니다."
  "희망":
    "enabled": true
    "cost": 0
    "description": "(패시브) 터미널을 하나 해제하면 45초간 신속II를 얻습니다. 최종 탈출구가 열린 이후 상시 신속 III."
  "위기감지":
    "enabled": true
    "cost": 1
    "description": "(액티브) 모든 활동 중 경찰을 5초간 빨갛게 발광시키고, 같은 월드에서 가장 가까운 경찰과의 거리를 채팅으로 알려줍니다."
  "공간지각력":
    "enabled": true
    "cost": 10
    "description": "(액티브) 가장 가까운 미해제 터미널 위치를 알려줍니다. 다음 미션 1회 성공 시 진행도를 총 50% 올립니다. 실패·취소해도 기회 소모."
  "공간추론력":
    "enabled": true
    "cost": 10
    "description": "(액티브) 가장 먼 미해제 터미널 위치를 알려줍니다. 다음 미션 1회 성공 시 진행도를 총 50% 올립니다. 실패·취소해도 기회 소모."
  "희망유발":
    "enabled": true
    "cost": 0
    "description": "(패시브) 자신이 터미널을 해제하면 모든 도둑의 체력이 전부 회복되고 기본 신속이 I → II로 15초간 상승합니다. 마지막 터미널일 경우 기본 신속II가 영구히 적용됩니다."
  "전파납치":
    "enabled": true
    "cost": 4
    "description": "(액티브) 가장 가까운 미해제 터미널의 미션을 원격으로 딱 1회 시도합니다. 성공하면 진행도 25% 증가."
  "운명공동체":
    "enabled": true
    "cost": 4
    "description": "(대상 액티브) 다른 도둑을 좌클릭하면 자신과 대상 모두 체력 완전 회복 및 15초간 신속II 상태가 됨."
  "다함께":
    "enabled": true
    "cost": 1
    "description": "(액티브) 반경 약 3블록에 2초간 유지되는 영역을 만듭니다. 영역의 도둑은 신속 II를 얻고, 경찰은 기본 신속을 잃습니다."
  "공감":
    "enabled": true
    "cost": 1
    "description": "(액티브) 내 체력이 하트 2.5개 이상이라면 하트 1개를 소모하고 다른 모든 도둑에게 하트 2개만큼 회복시킵니다.\n이 능력을 지니면 체력 회복이 불가능합니다. (단, 감옥에서 격리 해제 될 때에는 체력이 전부 회복됩니다.)\n내가 이 능력을 이전에 20번 이상 사용했다면, 흔적이 남는 투명화 상태가 됩니다."
  "솔로플레이":
    "enabled": true
    "cost": 0
    "description": "(패시브) 자신을 제외한 도둑이 전부 감옥/탈락 상태가 되면 감옥의 모든 도둑을 즉시 탈출 실패로 확정하고, 최종 탈출구를 열어 자신은 경찰 최초 시작 위치로 이동합니다. 게임당 1회. 시작 시 도둑이 3명 이상인 판에서만 낮은 확률로 등장합니다."
  "동료애":
    "enabled": true
    "cost": 4
    "description": "(액티브) 감옥 앞으로 즉시 순간이동합니다."
  "텔레파시":
    "enabled": true
    "cost": 1
    "description": "(액티브) 모든 활동 중 도둑에게 1초간 무적을 부여합니다. (자신포함, 쿨타임 0.1초)"
    "cooldown-seconds": 0.1
  "도발":
    "enabled": true
    "cost": 0
    "description": "(액티브+패시브) 상시 발광 + 배고픔 무한 유지. 우클릭 시 가장 가까운 경찰을 5초간 발광시키고 전체 채팅에 에헤헤 경찰들아 나잡아봐라~를 출력합니다."
  "옆사람보단":
    "enabled": true
    "cost": 0
    "description": "(패시브) 8블록 이내 다른 활동 중 도둑이 있으면 기본 이동속도가 최소 신속 II 수준으로 올라갑니다."
  "도굴꾼":
    "enabled": true
    "cost": 0
    "description": "(패시브) 다른 도둑이 최대 격리 횟수에 도달해 탈락하면 그 도둑이 가진 모든 마법서를 자신이 획득합니다.\n(단, 최대로 가지고 있을 수 있는 마법서는 이 마법서 포함 5개이며 그 이후부터는 가져올 수 없습니다.)"
  "확실한구출":
    "enabled": true
    "cost": 0
    "description": "(패시브) 감옥에서 다른 도둑을 구출할 성공 확률이 100%가 됩니다. 기본값은 5%.\n감옥에서 다른 도둑들을 구출할 경우 나 또한 12초간 투명화를 얻습니다."
  "강렬한구출":
    "enabled": true
    "cost": 0
    "description": "(패시브) 다른 도둑의 격리 해제에 성공하면 모든 활동 중 경찰이 5초간 이동 불가."
  "유출지연":
    "enabled": true
    "cost": 0
    "description": "(패시브) 도둑들이 발광되는 주기가 30초 늦춰집니다. 내가 발광 상태가 될 때마다 5초간 신속 IV를 얻습니다."
  "전의상실화":
    "enabled": true
    "cost": 3
    "description": "(액티브) 모든 활동 중 경찰을 2초간 이동 불가 상태로 만듭니다."
  "맑은눈빛":
    "enabled": true
    "cost": 3
    "description": "(액티브) 모든 활동 중 경찰에게 2초간 실명을 부여합니다."
  "나는 상체":
    "enabled": true
    "cost": 0
    "description": "(패시브) 나는 하체도 같이 보유하면 상시 신속 VII. 상체만 가지고 밤을 맞으면 30% 확률로 하체를 획득합니다."
  "나는 하체":
    "enabled": true
    "cost": 0
    "description": "(패시브) 나는 상체와 세트. 둘을 모두 보유하면 상시 신속 VII. 하체만 가지고 밤을 맞으면 30% 확률로 상체 획득."
  "도박사":
    "enabled": true
    "cost": 0
    "description": "(패시브) 터미널 해제 성공 시 60% 확률로 터미널 진행도가 50%p 오르고, 40% 확률로 0%p 오릅니다.\n터미널 하나 해제 성공할 경우 15초간 신속II를 얻습니다."
  "가림의응가":
    "enabled": true
    "cost": 1
    "description": "(액티브) 5초동안 움직일 수 없고 무적 상태가 됩니다. 전체 채팅에 난 응가야 히히. 저리 가! 를 출력합니다."
  "자갈빵":
    "enabled": true
    "cost": 0
    "description": "(패시브) 터미널 미션에 같은 확률로 자갈빵이 추가됩니다. 자갈을 클릭하면 90% 성공, 10% 실패합니다. 성공 유리판을 클릭하면 진행도를 올리고 15초간 신속 II를 얻습니다."
  "핫픽스":
    "enabled": true
    "cost": 1
    "description": "(액티브) 첫 사용 시 10초간 신속 X. 사용할 때마다 단계와 지속 시간이 1씩 감소하며 최소 신속 II, 2초입니다."
  "전등밑":
    "enabled": true
    "cost": 0
    "description": "(패시브) 경찰과 4블럭 이내에 있을 경우 완전 투명화. 단순 포션 투명화가 아니라 다른 플레이어에게 아예 숨겨집니다.\n(완전투명화일 뿐 피해는 받습니다.)"
  "너에게로":
    "enabled": true
    "cost": 10
    "description": "(액티브) 무작위 활동 중 도둑의 바라보는 방향 앞쪽 약 2블록으로 순간이동합니다. "
  "주사위":
    "enabled": true
    "cost": 5
    "description": "(액티브) 1~6의 주사위를 굴려 나온 수와 같은 단계의 신속을 그만큼의 초 동안 얻습니다."
  "필요한카드":
    "enabled": true
    "cost": 10
    "description": "(액티브) 일회용 전력질주·토끼뜀·완전투명화·폭풍질주를 하나씩 얻습니다. 일회용 카드는 마법석을 소모하지 않습니다."
  "공주":
    "enabled": true
    "cost": 0
    "description": "(패시브) 다른 활동 중 도둑이 터미널의 진행도를 높일 때마다 5초간 신속II를 얻습니다.\n다른 활동 중 도둑이 터미널의 진행도를 100%로 만들면 5초간 신속IV를 얻습니다."
  "목숨연장":
    "enabled": true
    "cost": 0
    "description": "(패시브) 직접 터미널을 2개 해제할 때마다 최대 격리 가능 횟수가 1 증가합니다."
  "분신술":
    "enabled": true
    "cost": 3
    "description": "(액티브) 내 스킨의 분신 4개가 서로 다른 방향으로 점프하며 달립니다. 3초 후 사라지며 그동안 재사용할 수 없습니다. 분신은 공격받지 않습니다."
  "반사":
    "enabled": true
    "cost": 10
    "description": "(액티브) 다음 격리 공격을 반사해 공격 경찰을 대신 30초간 감옥에 보냅니다. 사용할 때마다 이번 판의 이 능력 비용이 20 증가합니다."
  "퍼블은싫어":
    "enabled": true
    "cost": 0
    "description": "(패시브) 내가 3번째로 격리되어 탈출실패가 되어야 할 때, 이번 게임에서 탈출실패한 도둑이 이전에 없었다면\n2번째 격리로 판정되어 기회를 다시 얻습니다."
  "폭풍질주":
    "enabled": true
    "cost": 1
    "description": "(액티브) 2초간 신속 X."
  "두부러너":
    "enabled": true
    "cost": 0
    "description": "(패시브) 감옥에서 16블럭 이내에 있을 경우 신속III을 얻습니다."
  "잠재력":
    "enabled": true
    "cost": 0
    "description": "(패시브) 밤이 되면 능력을 하나 더 얻습니다. 밤의 추가 능력 목록에는 등장하지 않습니다."
  "건축학":
    "enabled": true
    "cost": 25
    "description": "(액티브) 터미널 하나를 무작위 위치에 추가로 생성합니다. 해제해야 하는 최대 터미널은 증가하지 않습니다.\n그 터미널의 위치를 경찰을 포함하여 모두에게 공개합니다.\n(이때 무작위 위치는 게임 시작할 때 터미널 후보위치들로 설정된 값들 중 하나다.)"
  "섣부른탈출":
    "enabled": true
    "cost": 5
    "description": "(액티브) 최종 탈출구가 닫혀 있을 경우 최종 탈출구로 순간이동합니다."
  "지하사람":
    "enabled": true
    "cost": 0
